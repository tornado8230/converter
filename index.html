<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
      content="width=device-width, initial-scale=1" />
    <title>конвертер валют</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
  </head>
  <body>
    <noscript>включите джаваскрипт</noscript>
    <div id="root">загруска приложения</div>

    <script type="module">
      try {
        const { mount } = await import(
          "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js"
        );
        mount(
          {
            requirements: [],
            entrypoint: "app.py",
            files: {
              "app.py": { url: "./app.py" },
            },
            streamlitConfig: {
              "client.toolbarMode": "viewer",
              "theme.base": "dark",
            },
          },
          document.getElementById("root"),
        );
      } catch (error) {
        document.getElementById("root").textContent =
          "Не удалось запустить приложение. Обновите страницу.";
        console.error(error);
    }
    </script>  
  </body>
</html>
